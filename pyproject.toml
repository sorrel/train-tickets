[project]
name = "train-tickets"
version = "0.1.0"
description = "CLI for looking up UK train advance ticket prices"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
]

[project.scripts]
trains = "tickets:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# Dependency groups are installed by `uv sync` where extras are not, so a
# plain `uv run python -m pytest` works without remembering `--extra dev`.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["core", "commands"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
